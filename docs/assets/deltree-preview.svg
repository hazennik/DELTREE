<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">DELTREE dashboard preview</title>
  <desc id="desc">A preview of the DELTREE menu and dashboard showing local Codex and Xcode storage grouped by source and safety.</desc>
  <rect width="1280" height="720" fill="#f5f7f9"/>
  <rect x="48" y="42" width="1184" height="636" rx="18" fill="#ffffff" stroke="#d8dee6"/>
  <rect x="48" y="42" width="1184" height="64" rx="18" fill="#14213d"/>
  <text x="82" y="83" fill="#ffffff" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">DELTREE</text>
  <text x="210" y="83" fill="#cbd5e1" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15">Local Codex/Xcode storage, explained before cleanup</text>
  <circle cx="1160" cy="72" r="9" fill="#2fb344"/>
  <rect x="80" y="138" width="260" height="500" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="104" y="176" fill="#111827" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Sources</text>
  <rect x="104" y="206" width="212" height="44" rx="8" fill="#e6f4ef"/>
  <text x="124" y="234" fill="#0f766e" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">All Storage</text>
  <text x="124" y="294" fill="#334155" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15">Codex workspaces</text>
  <text x="124" y="340" fill="#334155" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15">CoreSimulator</text>
  <text x="124" y="386" fill="#334155" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15">DerivedData</text>
  <text x="124" y="432" fill="#334155" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15">Result bundles</text>
  <rect x="374" y="138" width="812" height="116" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="404" y="180" fill="#111827" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">41.8 GB inspected</text>
  <text x="404" y="215" fill="#475569" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15">7.4 GB looks reclaimable after review</text>
  <rect x="748" y="176" width="180" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="748" y="176" width="116" height="12" rx="6" fill="#4f46e5"/>
  <rect x="952" y="176" width="180" height="12" rx="6" fill="#bbf7d0"/>
  <rect x="952" y="176" width="76" height="12" rx="6" fill="#16a34a"/>
  <rect x="374" y="284" width="812" height="292" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="404" y="326" fill="#111827" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Cleanup Candidates</text>
  <g font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="14">
    <text x="404" y="374" fill="#111827">Codex cache</text>
    <text x="704" y="374" fill="#475569">5.4 GB</text>
    <text x="828" y="374" fill="#047857">Safe to Remove</text>
    <text x="404" y="430" fill="#111827">Stale XCTest device data</text>
    <text x="704" y="430" fill="#475569">4.1 GB</text>
    <text x="828" y="430" fill="#047857">Safe to Remove</text>
    <text x="404" y="486" fill="#111827">Recent DerivedData</text>
    <text x="704" y="486" fill="#475569">1.7 GB</text>
    <text x="828" y="486" fill="#b45309">Review First</text>
    <text x="404" y="542" fill="#111827">Simulator runtimes</text>
    <text x="704" y="542" fill="#475569">18.2 GB</text>
    <text x="828" y="542" fill="#991b1b">Do Not Remove</text>
  </g>
  <rect x="980" y="604" width="166" height="42" rx="8" fill="#0f766e"/>
  <text x="1018" y="631" fill="#ffffff" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Review Cleanup</text>
</svg>
