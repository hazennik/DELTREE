name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    name: Workflow Validation
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: workflow-check
        name: Validate workflows
        run: make workflow-check

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Workflow Validation"
            echo "- Status: ${{ job.status }}"
            echo "- YAML and pinned-action checks: ${{ steps.workflow-check.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  repository-check:
    name: Repository Check
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: repository-check
        name: Check repository artifacts
        run: make repository-check

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Repository Check"
            echo "- Status: ${{ job.status }}"
            echo "- Artifact and size gate: ${{ steps.repository-check.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  script-tests:
    name: Script Tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: script-test
        name: Run script tests
        run: make script-test

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Script Tests"
            echo "- Status: ${{ job.status }}"
            echo "- Shell syntax and mocked script tests: ${{ steps.script-test.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Lint, Docs, Icon, And CLI
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lint tools
        run: brew install swiftformat swiftlint

      - id: lint
        name: Run Swift lint
        run: make lint

      - id: docs-check
        name: Validate documentation links
        run: make docs-check

      - id: icon-check
        name: Validate icon assets
        run: make icon-check

      - id: homebrew-check
        name: Validate Homebrew cask generation
        run: make homebrew-check

      - id: cli-dry-run
        name: Run CLI dry run
        run: make cli-dry-run

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Lint, Docs, Icon, And CLI"
            echo "- Status: ${{ job.status }}"
            echo "- Swift lint: ${{ steps.lint.outcome }}"
            echo "- Docs links: ${{ steps.docs-check.outcome }}"
            echo "- Icon assets: ${{ steps.icon-check.outcome }}"
            echo "- Homebrew cask generation: ${{ steps.homebrew-check.outcome }}"
            echo "- CLI dry run: ${{ steps.cli-dry-run.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Swift Package
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - id: dump-package
        name: Validate package manifest
        run: swift package dump-package

      - id: swift-test
        name: Run SwiftPM tests
        run: make swift-test

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Swift Package"
            echo "- Status: ${{ job.status }}"
            echo "- Package manifest: ${{ steps.dump-package.outcome }}"
            echo "- SwiftPM tests: ${{ steps.swift-test.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  xcode:
    name: Xcode Build, Test, Analyze
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version
        run: xcodebuild -version

      - id: test
        name: Run tests
        run: make test

      - id: release-build
        name: Build release configuration
        run: xcodebuild build -scheme DELTREE -project DELTREE.xcodeproj -configuration Release -destination 'platform=macOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - id: analyze
        name: Run analyzer
        run: make analyze

      - id: ui-test
        name: Run menu-bar and rendered UI smoke tests
        run: make ui-test

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Xcode Build, Test, Analyze"
            echo "- Status: ${{ job.status }}"
            echo "- Tests: ${{ steps.test.outcome }}"
            echo "- Release build: ${{ steps.release-build.outcome }}"
            echo "- Analyzer: ${{ steps.analyze.outcome }}"
            echo "- UI smoke tests: ${{ steps.ui-test.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  compatibility-build:
    name: Compatibility Build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build universal macOS 14 app
        run: >-
          xcodebuild build -quiet
          -scheme DELTREE
          -project DELTREE.xcodeproj
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath build/CompatibilityBuild
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          MACOSX_DEPLOYMENT_TARGET=14.0
          CODE_SIGNING_ALLOWED=NO

      - name: Verify compatibility metadata
        run: |
          source Scripts/release-artifacts.sh
          deltree_verify_binary_compatibility build/CompatibilityBuild/Build/Products/Release/DELTREE.app

      - name: Package compatibility app
        run: >-
          ditto -c -k --keepParent
          build/CompatibilityBuild/Build/Products/Release/DELTREE.app
          build/DELTREE-compatibility.zip

      - name: Upload compatibility app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DELTREE-compatibility-app
          path: build/DELTREE-compatibility.zip
          if-no-files-found: error
          retention-days: 1

  compatibility:
    name: Compatibility (${{ matrix.name }})
    needs: compatibility-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 14 Apple Silicon
            runner: macos-14
            architecture: arm64
          - name: macOS 15 Intel
            runner: macos-15-intel
            architecture: x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download compatibility app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DELTREE-compatibility-app
          path: build/CompatibilityDownload

      - name: Unpack compatibility app
        run: >-
          ditto -x -k
          build/CompatibilityDownload/DELTREE-compatibility.zip
          build/CompatibilityApp

      - name: Verify host and app architecture
        run: |
          sw_vers
          test "$(uname -m)" = "${{ matrix.architecture }}"
          lipo build/CompatibilityApp/DELTREE.app/Contents/MacOS/DELTREE -verify_arch "${{ matrix.architecture }}"
          source Scripts/release-artifacts.sh
          deltree_verify_binary_compatibility build/CompatibilityApp/DELTREE.app

      - name: Launch app
        run: |
          DELTREE_DISABLE_INITIAL_SCAN=1 \
          DELTREE_EXIT_AFTER_LAUNCH=1 \
          ruby Scripts/run-with-timeout.rb 60 -- build/CompatibilityApp/DELTREE.app/Contents/MacOS/DELTREE

  release-dry-run:
    name: Release Dry Run
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: package-check
        name: Validate package and notarization command paths
        run: make package-check

      - id: appcast-check
        name: Validate appcast generation
        run: make appcast-check

      - id: spark-sign-check
        name: Validate Sparkle signing command path
        run: make spark-sign-check

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Release Dry Run"
            echo "- Status: ${{ job.status }}"
            echo "- Package dry-run: ${{ steps.package-check.outcome }}"
            echo "- Appcast dry-run: ${{ steps.appcast-check.outcome }}"
            echo "- Sparkle signing dry-run: ${{ steps.spark-sign-check.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
