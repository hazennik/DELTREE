name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: macOS Tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: xcodebuild test -scheme DELTREE -project DELTREE.xcodeproj -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
