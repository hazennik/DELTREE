name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Scripts, CLI
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lint tools
        run: brew install swiftformat swiftlint

      - name: Run Swift lint
        run: make lint

      - name: Check shell scripts
        run: zsh -n Scripts/*.sh Tools/deltree

      - name: Run CLI dry run
        run: make cli-dry-run

  package:
    name: Swift Package
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Run SwiftPM tests
        run: make swift-test

  xcode:
    name: Xcode Build, Test, Analyze
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: make test

      - name: Build release configuration
        run: xcodebuild build -scheme DELTREE -project DELTREE.xcodeproj -configuration Release -destination 'platform=macOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Run analyzer
        run: make analyze

  release-dry-run:
    name: Release Dry Run
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate package and notarization command path
        run: make package-check

      - name: Validate appcast generation
        run: make appcast-check
