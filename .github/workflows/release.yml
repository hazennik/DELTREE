name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, Notarize, Publish
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DELTREE_NOTARY_PROFILE: deltree-notary
      DELTREE_DEVELOPER_ID_APPLICATION: ${{ secrets.DELTREE_DEVELOPER_ID_APPLICATION }}
      DELTREE_TEAM_ID: ${{ secrets.DELTREE_TEAM_ID }}
      DELTREE_SPARKLE_SIGNATURE: ${{ secrets.DELTREE_SPARKLE_SIGNATURE }}
      RELEASE_ZIP_URL_OVERRIDE: ${{ vars.DELTREE_RELEASE_ZIP_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install lint tools
        run: brew install swiftformat swiftlint

      - name: Prepare release metadata
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            echo "Release tag $release_tag does not exist." >&2
            exit 2
          fi
          git checkout --detach "$release_tag"

          version="${release_tag#v}"
          zip_url="${RELEASE_ZIP_URL_OVERRIDE:-https://github.com/$GITHUB_REPOSITORY/releases/download/$release_tag/DELTREE.zip}"

          echo "DELTREE_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "DELTREE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "DELTREE_RELEASE_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "DELTREE_RELEASE_ZIP_URL=$zip_url" >> "$GITHUB_ENV"

      - id: validate-repository
        name: Validate repository
        run: |
          make workflow-check
          make repository-check
          make script-test
          make lint
          make swift-test
          make test
          make analyze
          make cli-dry-run
          make package-check
          make appcast-check

      - name: Validate signing secrets
        env:
          DELTREE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DELTREE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DELTREE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DELTREE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DELTREE_KEYCHAIN_PASSWORD: ${{ secrets.DELTREE_KEYCHAIN_PASSWORD }}
          DELTREE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.DELTREE_APP_STORE_CONNECT_KEY_ID }}
          DELTREE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.DELTREE_APP_STORE_CONNECT_ISSUER_ID }}
          DELTREE_APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.DELTREE_APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            DELTREE_DEVELOPER_ID_CERTIFICATE_BASE64
            DELTREE_DEVELOPER_ID_CERTIFICATE_PASSWORD
            DELTREE_KEYCHAIN_PASSWORD
            DELTREE_DEVELOPER_ID_APPLICATION
            DELTREE_TEAM_ID
            DELTREE_APP_STORE_CONNECT_KEY_ID
            DELTREE_APP_STORE_CONNECT_ISSUER_ID
            DELTREE_APP_STORE_CONNECT_API_KEY_BASE64
            DELTREE_SPARKLE_SIGNATURE
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 2
            fi
          done

      - name: Configure signing certificate
        env:
          DELTREE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DELTREE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DELTREE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DELTREE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DELTREE_KEYCHAIN_PASSWORD: ${{ secrets.DELTREE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/deltree-release.keychain-db"

          echo "$DELTREE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$DELTREE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$DELTREE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$DELTREE_DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$DELTREE_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)

          echo "DELTREE_NOTARY_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Configure notarization profile
        env:
          DELTREE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.DELTREE_APP_STORE_CONNECT_KEY_ID }}
          DELTREE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.DELTREE_APP_STORE_CONNECT_ISSUER_ID }}
          DELTREE_APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.DELTREE_APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${DELTREE_APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$DELTREE_APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          xcrun notarytool store-credentials "$DELTREE_NOTARY_PROFILE" \
            --key "$api_key_path" \
            --key-id "$DELTREE_APP_STORE_CONNECT_KEY_ID" \
            --issuer "$DELTREE_APP_STORE_CONNECT_ISSUER_ID" \
            --keychain "$DELTREE_NOTARY_KEYCHAIN"

      - id: package-release
        name: Build, sign, and notarize
        run: zsh Scripts/package-release.sh --notarize

      - id: generate-appcast
        name: Generate Sparkle appcast
        run: zsh Scripts/generate-appcast.sh

      - id: upload-artifacts
        name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deltree-release
          path: |
            build/export/DELTREE.zip
            build/export/DELTREE.dSYM.zip
            build/export/appcast.xml

      - id: publish-release
        name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$DELTREE_RELEASE_TAG" \
            build/export/DELTREE.zip \
            build/export/DELTREE.dSYM.zip \
            build/export/appcast.xml \
            --title "DELTREE $DELTREE_RELEASE_VERSION" \
            --generate-notes \
            --verify-tag

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Release"
            echo "- Status: ${{ job.status }}"
            echo "- Repository validation: ${{ steps.validate-repository.outcome }}"
            echo "- Package, sign, notarize: ${{ steps.package-release.outcome }}"
            echo "- Appcast: ${{ steps.generate-appcast.outcome }}"
            echo "- Artifact upload: ${{ steps.upload-artifacts.outcome }}"
            echo "- GitHub Release: ${{ steps.publish-release.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
