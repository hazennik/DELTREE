name: Bug report
description: Report a reproducible DELTREE problem.
title: "[Bug]: "
labels: ["bug", "needs-triage", "needs-diagnostics"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact steps.
      placeholder: |
        1. Open DELTREE
        2. Run Scan Now
        3. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Install source
      options:
        - GitHub Release (when available)
        - Homebrew Cask (when available)
        - Built from source
        - Unknown
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste redacted diagnostic output from `Tools/deltree diagnose --json`. Do not paste `--raw-paths` output in public issues.
      render: text
